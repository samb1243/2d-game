<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>AI sim harness</title></head>
<body>
  <!-- state.js grabs this canvas; the sim never draws to it. -->
  <canvas id="game" width="960" height="540"></canvas>
  <pre id="out">RUNNING…</pre>

  <!-- Real game logic (draw.js / ui.js omitted — we never render). -->
  <script src="../js/constants.js"></script>
  <script src="../js/jump.js"></script>
  <script src="../js/state.js"></script>
  <script src="../js/levelgen.js"></script>
  <script src="../js/ai.js"></script>
  <script src="../js/physics.js"></script>

  <!-- Stubs for the DOM-facing helpers normally in ui.js / called by main.js. -->
  <script>
    function refreshHUD() {}
    function endGame()    {}
    function buildSetupUI() {}
    function syncSetupUI()  {}
  </script>

  <script src="../js/main.js"></script>

  <!-- Headless simulation: drive the AI through generated levels. -->
  <script>
  (function () {
    const lines = [];
    const log = (s) => lines.push(s);

    // ── Seeded RNG so every playthrough is reproducible across runs ───────
    function mulberry32(a) {
      return function () {
        a |= 0; a = (a + 0x6D2B79F5) | 0;
        let t = Math.imul(a ^ (a >>> 15), 1 | a);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }
    let rng = Math.random;
    Math.random = () => rng();
    const seedFor = (label, i) => {
      let h = 2166136261 >>> 0;
      const s = label + ':' + i;
      for (let k = 0; k < s.length; k++) { h ^= s.charCodeAt(k); h = Math.imul(h, 16777619); }
      return h >>> 0;
    };

    // Audit a freshly-generated level against the AI's OWN graph: is the flag
    // (and every gem) reachable from the AI spawn? Separates gen bugs from
    // AI-execution bugs.
    // The segment the player will stand on once it falls from the spawn point:
    // the highest surface at/below spawn in the spawn column.
    function spawnSegIdx(p) {
      const col = Math.floor((p.x + p.w / 2) / TILE);
      let best = -1, bestRow = 1e9;
      for (let i = 0; i < aiSegs.length; i++) {
        const s = aiSegs[i];
        if (col >= s.minCol && col <= s.maxCol && (s.row - 1) * TILE >= p.y - 1 && s.row < bestRow)
          { best = i; bestRow = s.row; }
      }
      return best;
    }

    function audit() {
      const spawn = spawnSegIdx(players[1]);
      if (spawn < 0) return ['spawn-off-graph'];
      const bad = [];
      const fSeg = getTargetSegIdx(flagPos.col * TILE + TILE / 2, (flagPos.row - 1) * TILE);
      if (fSeg < 0 || !bfsPath(spawn, fSeg)) bad.push('flag');
      gems.forEach((g, gi) => {
        const s = getTargetSegIdx(g.x, g.y);
        if (s < 0 || !bfsPath(spawn, s)) bad.push('g' + gi);
      });
      return bad;
    }

    // ── Jump model summary ───────────────────────────────────────────────
    log('=== JUMP MODEL ===');
    const cfgs = {
      easy:   DIFF.easy, medium: DIFF.medium, hard: DIFF.hard,
      'custom-s1': { gravity: 0.55, jump: -9.4, speed: CUSTOM_SPEED_LEVELS[1] },
      'custom-s5': { gravity: 0.55, jump: -9.4, speed: CUSTOM_SPEED_LEVELS[5] },
    };
    for (const [name, cfg] of Object.entries(cfgs)) {
      const m = buildJumpModel(cfg);
      const gaps = [];
      for (let r = 0; r <= m.maxRiseTiles + 1; r++) gaps.push(`r${r}≤${m.maxGapTilesForRise(r)}`);
      log(`${name.padEnd(10)} peak=${m.peak.toFixed(1)} maxRise=${m.maxRiseTiles}  ${gaps.join(' ')}`);
    }

    // ── End-to-end AI playthroughs ───────────────────────────────────────
    // Set difficulty + options, generate a level, then run the physics loop
    // headlessly until the AI (player 1) finishes or we hit the frame cap.
    function playOne(diffKey, custom, moving, capFrames, seed) {
      rng          = mulberry32(seed);
      diff         = diffKey;
      aiOpponent   = true;
      movingBlocks = moving;
      if (custom) customSettings = custom;

      initGame();
      const ai = players[1];
      const solvable = audit();          // graph reachability from spawn

      let deaths = 0, wasDead = false, jumps = 0, wasGround = ai.onGround;
      for (let f = 0; f < capFrames; f++) {
        animTick++;
        updatePlatforms();
        players.forEach(updatePlayer);
        if (ai.dead && !wasDead) deaths++;
        wasDead = ai.dead;
        if (wasGround && !ai.onGround && ai.vy < 0) jumps++;
        wasGround = ai.onGround;
        if (ai.finished) return { ok: true, frames: f, gems: ai.gemsCollected, deaths, jumps, solvable };
      }
      const col = Math.floor((ai.x + ai.w / 2) / TILE);
      const row = Math.floor((ai.y + ai.h) / TILE);
      return {
        ok: false, frames: capFrames, gems: ai.gemsCollected, deaths, jumps, solvable,
        stuck: `@${col},${row} mv=${ai.aiMoveType} seg=${getPlayerSegIdx(ai)}`,
      };
    }

    const CAP = 60 * 120;    // 120 simulated seconds
    const N   = 40;          // levels per configuration

    const configs = [
      { label: 'easy',          diff: 'easy',   custom: null, moving: false },
      { label: 'medium',        diff: 'medium', custom: null, moving: false },
      { label: 'hard',          diff: 'hard',   custom: null, moving: false },
      { label: 'medium+moving', diff: 'medium', custom: null, moving: true  },
      { label: 'custom-s1',     diff: 'custom', custom: { speedLevel: 1, gems: 5, obstacles: 'normal' }, moving: false },
      { label: 'custom-s5',     diff: 'custom', custom: { speedLevel: 5, gems: 5, obstacles: 'normal' }, moving: false },
    ];

    log('\n=== AI PLAYTHROUGHS (' + N + ' levels each, cap ' + CAP + ' frames) ===');
    let grandFail = 0, grandUnsolvable = 0;
    for (const c of configs) {
      let ok = 0; const fails = [];
      let sumFrames = 0;
      for (let i = 0; i < N; i++) {
        const r = playOne(c.diff, c.custom, c.moving, CAP, seedFor(c.label, i));
        if (r.ok) { ok++; sumFrames += r.frames; }
        else {
          const unsolv = r.solvable.length > 0;
          if (unsolv) grandUnsolvable++;
          fails.push(`#${i}(g${r.gems}/${GEM_COUNT} d${r.deaths} ${unsolv ? 'UNSOLVABLE[' + r.solvable.join(',') + ']' : r.stuck})`);
        }
      }
      grandFail += (N - ok);
      const avg = ok ? (sumFrames / ok / 60).toFixed(1) + 's' : '—';
      log(`${c.label.padEnd(14)} ${ok}/${N} solved  avg ${avg}`);
      if (fails.length) fails.forEach(f => log('    ' + f));
    }

    log('\nGRAND TOTAL FAILURES: ' + grandFail + '  (unsolvable layouts: ' + grandUnsolvable + ')');

    // ── Optional per-seed trace (debugging aid; not run by default) ───────
    // Call from the console or add a line below, e.g.
    //   etrace('medium', null, false, seedFor('medium', 6), 4500);
    // It replays one seed and prints the last ~40 state-change events plus the
    // final stuck/finished status — how every AI bug in this build was found.
    window.etrace = function (diffKey, custom, moving, seed, capFrames) {
      rng = mulberry32(seed);
      diff = diffKey; aiOpponent = true; movingBlocks = moving;
      if (custom) customSettings = custom;
      initGame();
      const ai = players[1];
      log(`\n=== ETRACE ${diffKey} seed ${seed} gems=${GEM_COUNT} flag@${flagPos.col},${flagPos.row} ===`);
      aiSegs.forEach((s, i) => log(`  seg${i} row${s.row} cols${s.minCol}-${s.maxCol}`));
      let pg = ai.onGround, pk = '', ring = [];
      for (let f = 0; f < capFrames; f++) {
        animTick++; updatePlatforms(); players.forEach(updatePlayer);
        const seg = getPlayerSegIdx(ai);
        const k = (ai.aiPath || []).join('>') + ':' + ai.aiMoveType;
        const ev = [];
        if (pg && !ai.onGround) ev.push(ai.vy < 0 ? 'JUMP' : 'off');
        if (!pg && ai.onGround) ev.push('LAND' + seg);
        if (k !== pk) ev.push('hop' + ai.aiHopFrom + '>' + ai.aiHopTo + ':' + ai.aiMoveType);
        if (ev.length) { ring.push(`  f${f} g${ai.gemsCollected} x${ai.x.toFixed(0)} y${ai.y.toFixed(0)} vy${ai.vy.toFixed(1)} jd${ai.aiJumpDir} lx${(ai.aiLandX||0).toFixed(0)} hf${ai.aiHopFrom}>${ai.aiHopTo} ${ev.join(' ')}`); if (ring.length > 40) ring.shift(); }
        pg = ai.onGround; pk = k;
        if (ai.finished) break;
      }
      ring.forEach(log);
      log(ai.finished ? '  FINISHED' : '  STUCK x' + Math.floor((ai.x + ai.w / 2) / TILE) + ' g' + ai.gemsCollected);
    };

    log('DONE');
    document.getElementById('out').textContent = lines.join('\n');
  })();
  </script>
</body>
</html>
